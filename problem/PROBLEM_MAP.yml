      continuum and why each needs its own anchor.
    resolution_docs: [einstein_from_kuramoto, continuum_limits,
                      gr_qm_unification_synthesis, lesson_epr_gr_qm_unification,
                      PROOF_A_gravity, PROOF_B_quantum]
