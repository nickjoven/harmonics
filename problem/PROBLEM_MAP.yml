      the imported charge assignment (D41 hardcodes the hypercharges);
      Gell-Mann–Nishijima holds with Y back-solved, not derived.
      Yang-Mills uniqueness via Utiyama + Cartan is the strongest leg,
      conditional on the same kinematics.
    resolution_docs: [gauge_sector_lovelock, discrete_gauge_resolution, gell_mann_nishijima]
    manifest_claims: [gauge_group, anomaly_cancellation]
    engines: [anomaly_check.py, fiber_bundle.py, xor_asymmetry.py]

  - id: gr_qm_unification
    title: "Unification of general relativity and quantum mechanics"
    posture: forced
    mode: articulated
    statement: >
      GR and QM are the two continuum limits of one substrate: Einstein's
      equations unique (Lovelock, D13) at the locked K=1 limit,
      Schrödinger structure at K<1, with the K=1 ↔ K<1 decoupling
