# Problem-surface map — named problems of physics vs this repository's
# defensible position on each.
#
# Curated by hand; validated and rendered by scripts/build_problem_map.py
# (which cross-checks every doc/claim/script reference against
# MANIFEST.yml, sync_cost/derivations/, and docs/corpus-index.json).
# Generated outputs: docs/problem-map.md, docs/problem-map.json.
#
# Organization model: each problem carries a POSTURE from the repo's own
# possibility-discipline discriminator (canonical_glossary.md §8):
#   forced    — substrate-forced resolution; Survives/Class 5 apparatus
#   declined  — structurally declined; the framework proves or argues it
#               should NOT predict this (obstruction exhibited)
#   proposed  — conditional or unreconciled prediction; testable but not
#               at Survives tier
#   open      — operationally open; honest gap, no framework claim
# and a MODE describing what kind of line is drawn:
#   derived | dissolved | articulated | declined | conditional | open
#
# The map is honesty-forward by construction: declined and open rows sit
# in the same file as the forced ones, because the declines carry
# executed disproofs and are part of the defensible surface.

version: 1
posture_vocab: [forced, declined, proposed, open]
mode_vocab: [derived, dissolved, articulated, declined, conditional, open]

problems:

  # ------------------------------------------------------------------
  # Tier 1 — substrate-forced (the firm lines)
  # ------------------------------------------------------------------

  - id: cosmological_constant_problem
    title: "Cosmological constant problem"
    moniker: "the worst prediction in physics (~120 orders of magnitude)"
    posture: forced
    mode: derived
    statement: >
      The magnitude of Λ is derived, not tuned: Λ·ℓ_P² = 13⁻¹⁰⁸/12 = 3/R²
      with R = 6·13⁵⁴ from Gaussian-lattice cell counting (0.1% in the
      exponent, 0.48% on R). The 120-order "catastrophe" is an artifact of
      computing vacuum energy in a framework where Λ is an input; here it
      is a counting output.
    resolution_docs: [hierarchy_gaussian_lattice, exponent, lesson_cosmological_constant]
    manifest_claims: [lambda_planck, hierarchy]
    test: >
      Tighter joint (Λ, H₀) determinations move R; the identity fails if
      the exponent drifts beyond its 0.1% window.

  - id: dark_energy_fraction
    title: "Dark energy fraction / cosmic coincidence problem"
    moniker: "why is Ω_Λ order unity now?"
    posture: open
    mode: articulated
    statement: >
      The bare Farey partition 13:5:1 over 19 supplies a substrate-side
      reference point Ω_Λ = 13/19 ≈ 0.684 — canonical per D1/C16 as a
      reference, not a prediction (the same partition puts Ω_b = 1/19,
      6.7% from observation). The two-component refinement (w₊ = 13/14,
      Ω_Λ = 181/264) is retracted to Class 2: w₊ is a numerical fit to
      Planck values and is computed by no script in the repo. The
      coincidence problem is open here; the partition is bookkeeping
      until a derivation forces the weights.
    resolution_docs: [omega_partition_combinatorial, farey_partition, baryon_fraction,
                      omega_b_alpha_beta_closure, psl2z_subgroup_phase_b,
                      L1_substrate_cusp_ground_state, w_plus_formalization]
    manifest_claims: [dark_energy, dark_energy_fraction_two_component]

  - id: dark_sector_composition
    title: "Dark matter and baryon fractions"
    moniker: "what fixes Ω_DM : Ω_b ≈ 5.4?"
    posture: open
    mode: articulated
    statement: >
      The bare partition gives Ω_DM : Ω_b = 5 : 1 against an observed
      ≈ 5.4 — a reference ratio, not a prediction (D1/C16). The
      two-component numbers previously quoted here (Ω_DM = 35/132,
      Ω_b = 13/264, ratio 70/13) inherit Class 2 from the fitted
      w₊ = 13/14 closure and are computed by no script. What fixes the
      ratio is open, at the fraction level and the particle level alike.
    resolution_docs: [baryon_fraction, omega_partition_combinatorial,
                      omega_b_alpha_beta_closure, L1_substrate_cusp_ground_state]
    manifest_claims: [dark_matter_fraction, baryon_fraction, dm_baryon_ratio]
    caveats: >
      No particle candidate is offered; galactic phenomenology is handled
      by the a₀ row below and does not depend on this partition.

  - id: strong_cp_problem
    title: "Strong CP problem"
    posture: proposed
    mode: conditional
    statement: >
      θ_QCD = 0 via Pin⁺(3) topology (D45) — conditional, retracted from
      Class 5 (2026-08-12): the derivation runs entirely on the K²
      configuration space, whose selection is an unsettled premise, and
      the eta-invariant input is an unverified import. If those premises
      hold, the substrate admits no θ-term: no axion, no tuning.
    resolution_docs: [coupling_scales]
    manifest_claims: [strong_cp]
    test: >
      Any measurement of θ ≠ 0 falsifies the conditional chain outright;
      discovery of a QCD axion doing the resolving would undercut the
      mechanism.

  - id: measurement_problem
    title: "Quantum measurement problem"
    moniker: "often called the most embarrassing problem in physics"
    posture: forced
    mode: dissolved
    statement: >
      Dissolved, not solved-by-interpretation: the substrate carries no
      projection postulate to reconcile with unitary evolution. Collapse
      is fidelity-bounded self-measurement; the preferred basis is basin
      selection (the saddle-node normal form fixes each context's basis
      structurally); the Born exponent 2 is saddle-node universality, not
      an axiom.
    resolution_docs: [collapse_dissolution, preferred_basis_dissolution,
                      lesson_forced_basin_selection, figure_eight,
                      born_rule, a1_from_saddle_node, fidelity_bound]
    manifest_claims: [born_rule]
    test: >
      Collapse duration τ ∝ 1/√ε with τΔω = const, and Zeno suppression,
      from the fidelity bound — testable in cavity QED / superconducting
      qubits.
    caveats: >
      The dissolution docs are Class-3 articulations resting on the
      Class-5 Born-rule apparatus; the falsifiable content lives in the
      collapse-timing predictions.

  - id: bell_nonlocality
    title: "Bell nonlocality / EPR"
    moniker: "how can correlations violate Bell bounds without signaling?"
    posture: forced
    mode: articulated
    statement: >
      Bell-violating, non-signaling statistics at exactly the Tsirelson
      bound (and Mermin |M| = 4 for GHZ) are derived substrate-internally.
      Bell's no-go is evaded honestly: the conserved Q mod 2 is a global
      topological invariant of the Klein-bottle context window, not a
      shared local hidden variable λ.
    resolution_docs: [epr_bell_assembly_theorem, bell_bounds_from_substrate,
                      ghz_from_substrate, q_mod2_conservation_theorem]
    caveats: >
      Reproduces QM's bounds rather than predicting deviations from them;
      the claim is structural explanation, not new statistics.

  - id: spacetime_dimensionality
    title: "Dimensionality and signature of spacetime"
    moniker: "why 3+1 and why Lorentz?"
    posture: open
    mode: open
    statement: >
      Open (demoted from the scorecard 2026-08-06, D2 disposition).
      d = 3 was claimed via the identification M = SL(2,ℝ), but the
      continuum-completion step names no mathematical operation
      (SL(2,ℤ) is discrete and closed in SL(2,ℝ)), and the same premises
      admit d = 2 and d = 1. The signature argument rests on a sign rule
      that contradicts the orientation character being a homomorphism.
      SL(2,ℂ) = Spin(3,1) is a true imported theorem; every arrow
      leading to it is open.
    resolution_docs: [three_dimensions, minkowski_signature, lie_group_characterization]
    open_problem_claims: [spatial_dimension, lorentz]

  - id: gauge_group_origin
    title: "Origin of the Standard Model gauge group"
    moniker: "why SU(3)×SU(2)×U(1), why do anomalies cancel?"
