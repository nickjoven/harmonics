# SPINE.yml — declarative backbone for the harmonics framework
#
# Each entry is a typed edge in the framework's epistemic graph,
# stating either a premise → outcome relation ("Based on X, Y
# occurs.") or an inheritance relation ("X inherits A from Y.").
# Each entry carries a list of equivalent forms — alternate
# phrasings of the same underlying claim — so the same edge can be
# rendered to a reader in whichever register suits the surrounding
# document.
#
# An agent crawling the repo can lift these edges directly into a
# Merkle DAG.  A human reader can pull alternate phrasings at the
# blurb level on the deployed Pages site via the shake-up icon
# (docs/genesis.html and anywhere else the data-spine attribute
# is wired).
#
# Schema:
#   id           — short kebab-case identifier
#   kind         — based-on  |  inherits-from
#   source       — which document the edge was first stated in
#   subject      — the consequent (based-on) or inheritor (inherits-from)
#   premises     — for kind: based-on, the list of premises
#   from         — for kind: inherits-from, the source object
#   forms        — list of equivalent phrasings (≥1)
#
# Cross-document edges may share an id with consistent kind/subject.
# Per-document spines live under section ids matched to the document
# in source.

version: 1

spine:

  # ──────────────────────────────────────────────────────────
  # README · Lede
  # ──────────────────────────────────────────────────────────

