name: Prototype validation

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-validate.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-validate.yml"
  workflow_dispatch:

concurrency:
  group: prototype-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast — runs the JS engine against the Python reference matrix.
  # Catches engine regressions in < 5 seconds.
  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JS engine smoke test
        working-directory: prototype
        run: node test/smoke_engine.mjs

  # End-to-end browser tests — drives the actual page in headless Chromium.
  e2e:
    runs-on: ubuntu-latest
    needs: engine-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: prototype/package-lock.json
      - name: Install Node dependencies
        working-directory: prototype
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: prototype
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: prototype/playwright-report/
          retention-days: 14

  # Performance + accessibility budgets.
  lighthouse:
    runs-on: ubuntu-latest
    needs: engine-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: prototype/package-lock.json
      - name: Install Node dependencies
        working-directory: prototype
        run: npm ci || npm install
      - name: Run Lighthouse CI
        working-directory: prototype
        run: |
          npm install -g @lhci/cli@0.14.x
          npx lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
