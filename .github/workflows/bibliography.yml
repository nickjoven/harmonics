name: Bibliography

# Academic-bibliography CI for the derivation framework. The docs cite
# the external literature inline (arXiv:NNNN.NNNNN / doi:10.NNNN/...);
# this workflow makes those citations first-class:
#
#   validate  (PRs + pushes)  Every arXiv id / DOI in the changed
#             sources must resolve to a real paper via the arXiv and
#             CrossRef APIs. Malformed ids and not-found citations fail
#             the check; a transient API outage only warns (see
#             scripts/bibliography/build_bibliography.py). Artifact
#             freshness is NOT enforced here -- the generated files are
#             owned by the regen job below, mirroring how
#             docs/derivation-graph.json is handled.
#
#   regen     (push to main)  Re-resolve all citations, refresh the
#             cache, and regenerate references.bib / REFERENCES.md /
#             docs/bibliography.json, then bot-commit the result
#             (race-safe), exactly as regen-derivation-graph.yml does.
#
# Citations are extracted from sync_cost/**.md. The committed
# scripts/bibliography/cache.json makes validation incremental: known
# citations validate from cache, only genuinely new ones hit the network.

on:
  push:
    branches: [main]
    paths:
      - "sync_cost/**.md"
      - "scripts/bibliography/**"
      - ".github/workflows/bibliography.yml"
  pull_request:
    paths:
      - "sync_cost/**.md"
      - "scripts/bibliography/**"
      - ".github/workflows/bibliography.yml"
  workflow_dispatch:

concurrency:
  group: bibliography-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required status check for branch protection: "validate".
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Unit tests (citation parsing, no network)
        run: python3 scripts/bibliography/test_bibliography.py

      - name: Validate citations resolve (arXiv + CrossRef)
        run: |
          python3 scripts/bibliography/build_bibliography.py check --no-artifacts

  # Owns scripts/bibliography/cache.json, references.bib, REFERENCES.md,
  # and docs/bibliography.json. Runs only on push to main; PRs do not
  # regenerate (would race with concurrent merges, and the artifacts are
  # not load-bearing for any test). Same race-safe push loop as
  # regen-derivation-graph.yml.
  regen:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bibliography-regen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate bibliography
        run: python3 scripts/bibliography/build_bibliography.py build

      - name: Commit and push (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="scripts/bibliography/cache.json sync_cost/derivations/references.bib sync_cost/derivations/REFERENCES.md docs/bibliography.json"
          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- $FILES; then
              echo "::notice::bibliography artifacts already up to date"
              exit 0
            fi
            git add $FILES
            git commit -m "bot: regenerate bibliography

          Auto-generated by .github/workflows/bibliography.yml in response
          to changes under sync_cost/**.md. Citations resolved via the
          arXiv and CrossRef APIs."
            if git push origin HEAD:main; then
              echo "::notice::pushed regenerated bibliography (attempt $attempt)"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt); syncing to origin/main and regenerating"
            git fetch origin main
            git reset --hard FETCH_HEAD
            python3 scripts/bibliography/build_bibliography.py build
          done
          echo "::error::could not push regenerated bibliography after 5 attempts"
          exit 1
