name: Regenerate derivation graph

# Owns docs/derivation-graph.json. The file is generated by
# scripts/build_derivation_graph.py from the cross-references in
# sync_cost/derivations/*.md. Previously this regeneration ran in a
# local PostToolUse hook (scripts/hooks/post_edit_regen.py) and produced
# constant working-tree drift on developer machines. Moving it to CI
# makes the file CI-owned: contributors do not regenerate or commit it
# themselves, the workflow does.
#
# Triggers only on push to main. PRs do not regenerate the file because
# (a) doing so would race with concurrent merges, and (b) the file is
# not load-bearing for any test in the repo. Stale graph state is
# tolerated for the few seconds between merge and bot-commit.

on:
  push:
    branches: [main]
    paths:
      - "sync_cost/derivations/*.md"
      - "scripts/build_derivation_graph.py"
      - ".github/workflows/regen-derivation-graph.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-derivation-graph
  # Don't cancel in-flight regenerations; we want every push to be handled
  # so the file converges to the latest state.
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so build_derivation_graph.py can populate
          # per-node git metadata (commit hash + date + subject).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate derivation graph
        run: python3 scripts/build_derivation_graph.py

      - name: Commit if changed
        run: |
          if git diff --quiet docs/derivation-graph.json; then
            echo "::notice::No changes to docs/derivation-graph.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/derivation-graph.json
          git commit -m "bot: regenerate docs/derivation-graph.json

          Auto-generated by .github/workflows/regen-derivation-graph.yml
          in response to changes under sync_cost/derivations/*.md."
          git push
