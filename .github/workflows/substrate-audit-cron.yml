name: substrate-audit-cron

# Scheduled adversarial audit: runs the committed /substrate-audit
# protocol (.claude/commands/substrate-audit.md) with Claude Code in
# CI and files the session report as an issue comment on the rolling
# audit thread. Requires the ANTHROPIC_API_KEY repository secret.
# If the secret is missing the job FAILS — a scheduled audit that
# did not run must not show a green checkmark (an earlier revision
# no-opped green, which read as "audited" when nothing ran).

on:
  schedule:
    - cron: '0 8 * * 3'   # Wednesdays 08:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: 'optional focus argument passed to /substrate-audit'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: substrate-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Require the audit to be runnable
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY not set — the scheduled \
          audit DID NOT RUN. Set the secret or disable the schedule; \
          a green no-op here would misreport audit coverage."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet blake3 pyyaml

      - name: Run the audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/substrate-audit ${{ inputs.focus }}"
          claude_args: "--max-turns 80"
        env:
          GH_TOKEN: ${{ github.token }}
