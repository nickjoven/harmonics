name: substrate-audit-cron

# Scheduled adversarial audit: runs the committed /substrate-audit
# protocol (.claude/commands/substrate-audit.md) with Claude Code in
# CI and files the session report as an issue comment on the rolling
# audit thread. Requires the ANTHROPIC_API_KEY repository secret;
# until it is set, runs no-op with a notice, so this workflow is safe
# to merge before the secret exists.

on:
  schedule:
    - cron: '0 8 * * 3'   # Wednesdays 08:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: 'optional focus argument passed to /substrate-audit'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: substrate-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; audit skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet blake3 pyyaml

      - name: Run the audit
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/substrate-audit ${{ inputs.focus }}"
          claude_args: "--max-turns 80"
        env:
          GH_TOKEN: ${{ github.token }}
