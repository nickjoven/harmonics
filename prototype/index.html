<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metronome wall — coupled oscillators on S¹</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div id="header">
      <span><span class="label">|r|</span><span class="readout" id="r-readout">0.000</span></span>
      <span><span class="label">clusters</span><span class="readout" id="cluster-readout">—</span></span>
      <span><span class="label">K</span><span class="readout" id="k-readout">0.000</span></span>
      <span><span class="label">K_c (uniform Lorentzian)</span><span class="readout">2/π = 0.637</span></span>
      <span style="margin-left: auto; color: var(--muted); font-size: 0.85rem;">
        validation: <a href="./test/tongue_widths.html" style="color: var(--accent);">tongue_widths.html</a>
      </span>
    </div>

    <div id="main">
      <div id="wall">
        <span class="panel-title">Wall</span>
        <canvas id="wall-canvas"></canvas>
      </div>
      <div id="staircase">
        <span class="panel-title">W(Ω) — devil's staircase</span>
        <canvas id="staircase-canvas"></canvas>
      </div>
    </div>

    <div id="footer">
      <label>
        K
        <input id="k-slider" type="range" min="0" max="1.5" step="0.005" value="0" />
      </label>
      <label>
        distribution
        <select id="dist-select">
          <option value="uniform" selected>uniform [0, 1]</option>
          <option value="lorentzian">Lorentzian (γ = 0.08)</option>
          <option value="farey">Farey-clustered</option>
        </select>
      </label>
      <label>
        N
        <select id="n-select">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="400">400</option>
        </select>
      </label>
      <label>
        <input id="audio-toggle" type="checkbox" /> audio
      </label>
      <span class="preset-bar">
        <button data-preset="K0">K = 0</button>
        <button data-preset="Kc">K = K_c</button>
        <button data-preset="K1">K = 1</button>
      </span>
      <button id="reset-btn">reseed</button>
    </div>

    <div id="tooltip"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
