# --- Open problems (demoted from scorecard 2026-08-06) ---
# Rows whose derivation chain has a named, unresolved break. Demoted
# per the D2 disposition: the chain from SL(2,Z) to SL(2,R) rests on
# a "completes to" step that names no mathematical operation
# (three_dimensions.md:49-77; SL(2,Z) is discrete and closed in
# SL(2,R) — measure convergence of Farey points is about point sets,
# not groups). check_manifest.py flags three_dimensions.md as a
# Class-1/3 carrier; these rows return to the scorecard if and when
# the completion step gets an actual construction.

open_problems:
  spatial_dimension:
    name: "Spatial dimension"
    conjectured: "3 = dim SL(2,R)"
    observed: "3"
    source: ["D14"]
    status: >
      Open. The identification M = SL(2,R) is conjectured, not
      derived: Step 2's continuum completion is undefined, Step 3c's
      trivial-isotropy argument presupposes oscillators are group
      elements (the conclusion), and the same premises admit d = 2
      (H^2 construction, three_dimensions.md:66-71) and d = 1
      (boundary, :183). qd_origins.md Argument 3 (cited as closing
      the gap on 2026-05-15) parameterizes the substrate by SL(2,R)
      and therefore presupposes d = 3. An honest closure requires a
      completion construction that forces dim 3 without assuming it.

  lorentz:
    name: "Lorentz symmetry"
    conjectured: "Spin(3,1) via SL(2,C)"
    observed: "SO+(3,1)"
    source: ["D14", "D15"]
    status: >
      Open. Inherits the spatial_dimension break, plus: sl(2,R) is
      so(2,1), not so(3), so it cannot be the rotation subalgebra
      claimed at three_dimensions.md:294-307; the signature argument
      rests on "(-1)x(-1) = -1 on a non-orientable surface"
      (minkowski_signature.md:171-206), which contradicts the
      orientation character being a homomorphism. SL(2,C) = Spin(3,1)
      itself is a true imported theorem; what is open is every arrow
      leading to it.

