<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Georgia, serif">
  <defs>
    <radialGradient id="sphereGrad" cx="0.35" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="60%" stop-color="#dde9ff"/>
      <stop offset="100%" stop-color="#7fa3d9"/>
    </radialGradient>
    <radialGradient id="backgroundGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fff8e1" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">
    Antipodal Pairing on the Inverse Stereographic Sphere
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" font-style="italic" fill="#555">
    Geometric realization of the particle/antiparticle ↔ dark energy unification
  </text>

  <!-- Cosmological constant background glow -->
  <circle cx="430" cy="370" r="240" fill="url(#backgroundGlow)"/>

  <!-- Sphere -->
  <circle cx="430" cy="370" r="220" fill="url(#sphereGrad)" stroke="#333" stroke-width="2.5"/>

  <!-- Latitude circles (depth perception) -->
  <ellipse cx="430" cy="260" rx="180" ry="22" fill="none" stroke="#5478a8" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="430" cy="370" rx="220" ry="0" fill="none" stroke="#5478a8" stroke-width="1" opacity="0.6"/>
  <ellipse cx="430" cy="480" rx="180" ry="22" fill="none" stroke="#5478a8" stroke-width="0.8" opacity="0.4"/>

  <!-- Equator (the projected real line, with rationals) -->
  <line x1="210" y1="370" x2="650" y2="370" stroke="#444" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="655" y="374" font-size="12" fill="#444">equator = ℚ ∪ {∞}</text>

  <!-- Ford circle markers on the equator (rationals) -->
  <circle cx="350" cy="370" r="3" fill="#333"/>
  <circle cx="430" cy="370" r="4" fill="#333"/>
  <circle cx="510" cy="370" r="3" fill="#333"/>
  <circle cx="290" cy="370" r="2" fill="#666"/>
  <circle cx="570" cy="370" r="2" fill="#666"/>
  <text x="350" y="362" text-anchor="middle" font-size="10" fill="#555">1/2</text>
  <text x="430" y="362" text-anchor="middle" font-size="10" fill="#555">1/1</text>
  <text x="510" y="362" text-anchor="middle" font-size="10" fill="#555">2/1</text>

  <!-- North pole (point at infinity from the plane) -->
  <circle cx="430" cy="150" r="6" fill="#222"/>
  <text x="442" y="146" font-size="13" fill="#222">N: ∞ (point at infinity)</text>

  <!-- South pole = our pocket -->
  <circle cx="430" cy="590" r="8" fill="#1565c0"/>
  <text x="442" y="596" font-size="13" fill="#1565c0">S: our pocket</text>

  <!-- Hubble horizon -->
  <ellipse cx="430" cy="565" rx="68" ry="16" fill="none" stroke="#1565c0" stroke-width="2" opacity="0.8"/>
  <text x="500" y="558" font-size="11" fill="#1565c0">Hubble horizon</text>

  <!-- Central antipodal axis -->
  <line x1="430" y1="150" x2="430" y2="590" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Center marker -->
  <circle cx="430" cy="370" r="3" fill="#888"/>

  <!-- Antipodal pair 1: ψ and ψ* -->
  <circle cx="355" cy="270" r="7" fill="#e65100" stroke="#444" stroke-width="0.5"/>
  <text x="245" y="265" font-size="13" fill="#e65100" font-style="italic" font-weight="bold">ψ (particle)</text>

  <circle cx="505" cy="470" r="7" fill="#6a1b9a" stroke="#444" stroke-width="0.5"/>
  <text x="515" y="478" font-size="13" fill="#6a1b9a" font-style="italic" font-weight="bold">ψ* (antiparticle)</text>

  <!-- Connecting antipodal line through center -->
  <line x1="355" y1="270" x2="505" y2="470" stroke="#666" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Antipodal pair 2 (lighter, showing pattern) -->
  <circle cx="290" cy="370" r="5" fill="#e65100" opacity="0.55"/>
  <circle cx="570" cy="370" r="5" fill="#6a1b9a" opacity="0.55"/>
  <line x1="290" y1="370" x2="570" y2="370" stroke="#888" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.45"/>

  <!-- Antipodal pair 3 (lighter, near pole) -->
  <circle cx="395" cy="200" r="5" fill="#e65100" opacity="0.55"/>
  <circle cx="465" cy="540" r="5" fill="#6a1b9a" opacity="0.55"/>
  <line x1="395" y1="200" x2="465" y2="540" stroke="#888" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.45"/>

  <!-- Label for K² identification -->
  <text x="430" y="345" text-anchor="middle" font-size="11" fill="#333" font-style="italic">K² deck:</text>
  <text x="430" y="358" text-anchor="middle" font-size="11" fill="#333" font-style="italic">ψ ↔ −ψ*</text>

  <!-- Inverse stereographic projection annotation -->
  <line x1="430" y1="675" x2="430" y2="615" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="700" text-anchor="middle" font-size="12" fill="#555" font-style="italic">
    inverse stereographic projection from ℝ² ∪ {∞} → S²
  </text>

  <!-- Right legend box: Ω partition -->
  <rect x="700" y="140" width="180" height="220" fill="#fffdf3" stroke="#aaa" stroke-width="1.2" rx="6"/>
  <text x="790" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Ω partition</text>
  <text x="790" y="185" text-anchor="middle" font-size="11" fill="#666" font-style="italic">(from 13:5:1/19)</text>

  <line x1="715" y1="195" x2="875" y2="195" stroke="#aaa" stroke-width="0.5"/>

  <text x="715" y="220" font-size="12" fill="#e65100">Ω_Λ = 13/19 ≈ 0.684</text>
  <text x="715" y="237" font-size="10" fill="#666">↑ antipodal-pair integral</text>

  <text x="715" y="265" font-size="12" fill="#388e3c">Ω_DM = 5/19 ≈ 0.263</text>
  <text x="715" y="282" font-size="10" fill="#666">↑ unpaired Z₅ structure</text>

  <text x="715" y="310" font-size="12" fill="#1565c0">Ω_b = 1/19 ≈ 0.053</text>
  <text x="715" y="327" font-size="10" fill="#666">↑ pocket baryons</text>

  <line x1="715" y1="335" x2="875" y2="335" stroke="#aaa" stroke-width="0.5"/>
  <text x="790" y="352" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">Σ = 19/19 = 1</text>

  <!-- Right side: framework correspondences -->
  <rect x="700" y="390" width="180" height="210" fill="#f3f9ff" stroke="#aaa" stroke-width="1.2" rx="6"/>
  <text x="790" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Geometric ↔ framework</text>
  <line x1="715" y1="420" x2="875" y2="420" stroke="#aaa" stroke-width="0.5"/>

  <text x="715" y="442" font-size="10.5" fill="#333">South pole → our pocket</text>
  <text x="715" y="460" font-size="10.5" fill="#333">North pole → ∞ at projection</text>
  <text x="715" y="478" font-size="10.5" fill="#333">Equator → ℚ via Ford circles</text>
  <text x="715" y="496" font-size="10.5" fill="#333">Antipodes → ψ ↔ ψ* pairing</text>
  <text x="715" y="514" font-size="10.5" fill="#333">Sphere surface → K=1 medium</text>
  <text x="715" y="532" font-size="10.5" fill="#333">Hubble disk → 12.66-mode horizon</text>
  <text x="715" y="550" font-size="10.5" fill="#333">Integrated pairs → Ω_Λ (yellow glow)</text>
  <text x="715" y="568" font-size="10.5" fill="#333">Non-orientability → K² ≅ ℝP² (mod 2)</text>
  <text x="715" y="586" font-size="10.5" fill="#333">Antipodal axis → deck transformation</text>

  <!-- Bottom caption -->
  <rect x="60" y="660" width="700" height="50" fill="none"/>
  <text x="20" y="660" font-size="11" fill="#555" font-style="italic">
    Particles and antiparticles sit on antipodal points; their integrated contribution distributes uniformly on the sphere → Ω_Λ.
  </text>
  <text x="20" y="675" font-size="11" fill="#555" font-style="italic">
    Our pocket occupies a small region around the south pole (within the Hubble horizon). The K=1 medium is the rest of the sphere.
  </text>
  <text x="20" y="690" font-size="11" fill="#555" font-style="italic">
    The cosmological constant problem dissolves because the sphere is finite: no continuum divergence in the antipodal-pair sum.
  </text>
</svg>
